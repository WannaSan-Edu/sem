
name: Java CI with Tests, Coverage and Docker

on:
  push:
    branches:
      - master
      - lab08

  pull_request:
    branches:
      - master
      - lab08

jobs:

  # Unit Tests
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: mvn clean -Dtest=com.napier.devops.AppTest test

      - name: Upload Unit Test Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: unit-tests
          fail_ci_if_error: false

  # Integration Tests
  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Start Database Container
        run: |
          docker build -t database ./db
          docker run --name employees -dp 33060:3306 database

      - name: Wait for Database
        run: |
          for i in {1..30}; do
            if docker exec employees mysqladmin ping -h 127.0.0.1 --silent; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database..."
            sleep 2
          done
          echo "Database did not become ready"
          docker logs employees
          exit 1

      - name: Run Integration Tests
        run: mvn clean -Dtest=com.napier.devops.AppIntegrationTest test

      - name: Upload Integration Test Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: integration-tests
          fail_ci_if_error: false

      - name: Stop and Remove Database
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker image rm database || true

  # Build and Docker Compose
  Build:
    name: Build and Run Docker Compose
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Maven Package
        run: mvn clean package -DskipTests

      - name: Run Docker Compose
        run: docker compose up --build --abort-on-container-exit

      - name: Stop Docker Compose
        if: always()
        run: docker compose down
