
name: A workflow for my Hello World App

on:
  push:
    branches:
      - master
      - lab08

  pull_request:
    branches:
      - master
      - lab08

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit Tests
        run: mvn clean -Dtest=com.napier.devops.AppTest test

      - name: CodeCov
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./target/site/jacoco
          flags: unit-tests
          verbose: true

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Database and Run Integration Tests
        run: |
          docker build -t database ./db
          docker run --name employees -dp 33060:3306 database

          for i in {1..30}; do
            if docker exec employees mysqladmin ping -h 127.0.0.1 --silent; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

          docker exec employees mysqladmin ping -h 127.0.0.1 --silent

          mvn clean -Dtest=com.napier.devops.AppIntegrationTest test

      - name: CodeCov
        if: always()
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./target/site/jacoco
          flags: integration-tests
          verbose: true

      - name: Stop and Remove Database
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker image rm database || true

  build:
    name: Build Run in Docker and Deploy Release
    runs-on: ubuntu-22.04
    needs:
      - UnitTests
      - IntegrationTests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --build --abort-on-container-exit

      - name: Deploy Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "latest"
          files: |
            ./target/*.jar

      - name: Stop Docker Compose
        if: always()
        run: docker compose down
