
services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    restart: always
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
